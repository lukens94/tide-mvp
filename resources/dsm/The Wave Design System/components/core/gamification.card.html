<!-- @dsCard group="Components" viewport="700x420" name="Gamification & forms" subtitle="Segmented control, avatars, level badge, streak, textarea" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 24px; }
  .sec { margin-bottom: 24px; }
  .sec-lab { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .flow { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .blue { background: var(--blue); border-radius: var(--r-4xl); padding: 18px 20px; display: flex; align-items: center; gap: 18px; }
  .oncream { background: var(--cream); border-radius: var(--r-3xl); padding: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { SegmentedControl, Avatar, LevelBadge, StreakPill, Textarea } = window.TheWaveDesignSystem_664d29;
    function Demo() {
      const [seg, setSeg] = React.useState('game');
      return (
        <div>
          <div className="sec"><div className="sec-lab">Segmented control · Avatars</div>
            <div className="flow">
              <SegmentedControl value={seg} onChange={setSeg} options={[{value:'game',label:'Dashboard'},{value:'track',label:'Tracking'}]} />
              <Avatar initials="SR" color="#FFD400" ring />
              <Avatar initials="MB" color="#0057FF" size={48} />
              <Avatar initials="AD" color="#CDC3BA" size={38} />
            </div>
          </div>
          <div className="sec"><div className="sec-lab">Level badge · Streak (on blue hero)</div>
            <div className="blue">
              <LevelBadge level={3} />
              <div>
                <div style={{fontWeight:800,fontSize:'1.1rem',color:'var(--cream)',marginBottom:'8px'}}>Continua così! 🎯 <StreakPill>🔥 4 giorni di fila</StreakPill></div>
                <div className="mono" style={{fontSize:'.8rem',color:'var(--cream)',opacity:.9}}>340 XP totali</div>
              </div>
            </div>
          </div>
          <div className="sec"><div className="sec-lab">Textarea (on cream)</div>
            <div className="oncream">
              <Textarea light label="Note dello sprint" rows={3} defaultValue="Consegnare il restyle completo dell'area cliente entro fine mese." />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
