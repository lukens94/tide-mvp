<!-- @dsCard group="Components" viewport="700x680" name="Core primitives" subtitle="Buttons, controls, tiles, badges, progress & feedback" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 24px; }
  .sec { margin-bottom: 26px; }
  .sec-lab { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .flow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .oncream { background: var(--cream); border-radius: var(--r-3xl); padding: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const NS = window.TheWaveDesignSystem_664d29;
    const { Button, IconButton, Select, Input, Checkbox, Tabs, StatTile, GameStat,
            ProgressBar, SprintProjectRow, Chip, Badge, WeekButton, Spinner, Toast } = NS;
    const Plus = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Menu = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;

    function Demo() {
      const [tab, setTab] = React.useState('summary');
      const [done, setDone] = React.useState(true);
      return (
        <div>
          <div className="sec"><div className="sec-lab">Buttons & icon buttons</div>
            <div className="flow">
              <Button icon={<Plus/>}>Nuovo Sprint</Button>
              <Button variant="ghost">Annulla</Button>
              <Button disabled>Salvato</Button>
              <IconButton title="Menu"><Menu/></IconButton>
              <IconButton title="Aggiungi" active><Plus/></IconButton>
            </div>
          </div>
          <div className="sec"><div className="sec-lab">Select · Tabs · Week buttons</div>
            <div className="flow">
              <Select options={['Sprint Luglio','Sprint Agosto']} />
              <div className="oncream" style={{padding:'10px 14px'}}><Select light options={['RCA','ABX','DEV']} /></div>
              <WeekButton active>Sett 1</WeekButton>
              <WeekButton>Sett 2</WeekButton>
            </div>
            <div className="oncream" style={{marginTop:'12px'}}>
              <Tabs tabs={[{value:'summary',label:'Sprint'},{value:'calendar',label:'Calendario Ore'},{value:'workspace',label:'Workspace'}]} value={tab} onChange={setTab} />
            </div>
          </div>
          <div className="sec"><div className="sec-lab">Stat tiles · Game stats</div>
            <div className="grid3">
              <StatTile tone="sand" num="128" label="Story points" />
              <StatTile tone="dark" num="42" label="Task fatti" />
              <StatTile tone="yellow" num="6" label="Progetti" />
            </div>
            <div className="grid3" style={{marginTop:'12px'}}>
              <GameStat num="12" label="Task fatti" />
              <GameStat num="3.5" label="Story points" />
              <GameStat num="02" label="Sprint" />
            </div>
          </div>
          <div className="sec"><div className="sec-lab">Progress · Sprint project row · Chips</div>
            <div className="grid2">
              <SprintProjectRow code="RCA" name="Restyle Cliente A" color="#0057FF" assigned={20} worked={13} />
              <SprintProjectRow code="ABX" name="App B" color="#FFD400" assigned={12} worked={12} />
            </div>
            <div className="oncream" style={{marginTop:'12px'}}><ProgressBar value={67} /></div>
            <div className="flow" style={{marginTop:'12px'}}>
              <Chip color="#0057FF">Restyle Cliente A</Chip>
              <Chip color="#FFD400">App B</Chip>
              <Chip color="#CDC3BA">Docs</Chip>
            </div>
          </div>
          <div className="sec"><div className="sec-lab">Input · Checkbox (on cream)</div>
            <div className="oncream">
              <Input light label="Nome Sprint" placeholder="es. Sprint Luglio" />
              <div style={{marginTop:'12px'}}>
                <Checkbox label="Setup progetto" checked={done} onChange={setDone} />
                <Checkbox label="Review con il cliente" checked={false} onChange={()=>{}} />
              </div>
            </div>
          </div>
          <div className="sec"><div className="sec-lab">Badges · Toasts · Spinner</div>
            <div className="grid3">
              <Badge icon="🚀" name="Primo progetto" desc="Crea 1 progetto" />
              <Badge icon="🏆" name="Centurione" desc="100 story points" locked />
              <Badge icon="🔥" name="Maratoneta" desc="50 task completati" />
            </div>
            <div className="flow" style={{marginTop:'12px'}}>
              <Toast type="success">Livello 3 raggiunto! 🎉</Toast>
              <Toast type="error">Non salvato</Toast>
              <Spinner size={30} />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
