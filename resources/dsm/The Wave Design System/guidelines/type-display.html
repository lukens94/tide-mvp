<!-- @dsCard group="Type" viewport="700x300" name="Display scale" subtitle="Schibsted Grotesk — heavy weights, tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; background: var(--cream); color: var(--black); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--cream-mut); letter-spacing: .06em; white-space: nowrap; width: 96px; flex: none; }
  .spec { font-weight: 800; letter-spacing: -.02em; line-height: 1; }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="meta">92 / 800</span><span class="spec" style="font-size:72px;letter-spacing:-.04em">128</span></div>
    <div class="line"><span class="meta">32 / 800</span><span class="spec" style="font-size:32px">Workspace progetti</span></div>
    <div class="line"><span class="meta">24 / 800</span><span class="spec" style="font-size:24px">Timesheet · Settimana 1</span></div>
    <div class="line"><span class="meta">16 / 500</span><span class="spec" style="font-size:16px;font-weight:500;letter-spacing:0">Body copy in Schibsted Grotesk regular-medium.</span></div>
  </div>
</body>
</html>
