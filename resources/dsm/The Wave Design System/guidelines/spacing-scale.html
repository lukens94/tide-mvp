<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="Built on a 14px gutter (bento gaps, card gaps)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--blue); border-radius: 4px; width: 100%; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 8px; white-space: nowrap; }
  .item.key .bar { background: var(--yellow); }
  .item.key .lab { color: var(--yellow); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:4px"></div><div class="lab">4</div></div>
    <div class="item"><div class="bar" style="height:8px;width:8px"></div><div class="lab">8</div></div>
    <div class="item"><div class="bar" style="height:10px;width:10px"></div><div class="lab">10</div></div>
    <div class="item"><div class="bar" style="height:12px;width:12px"></div><div class="lab">12</div></div>
    <div class="item key"><div class="bar" style="height:14px;width:14px"></div><div class="lab">14 ·gutter</div></div>
    <div class="item"><div class="bar" style="height:18px;width:18px"></div><div class="lab">18</div></div>
    <div class="item"><div class="bar" style="height:22px;width:22px"></div><div class="lab">22</div></div>
    <div class="item"><div class="bar" style="height:30px;width:30px"></div><div class="lab">30</div></div>
  </div>
</body>
</html>
