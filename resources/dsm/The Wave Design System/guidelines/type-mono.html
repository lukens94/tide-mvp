<!-- @dsCard group="Type" viewport="700x220" name="Mono system voice" subtitle="Space Mono — UPPERCASE, wide tracking, for labels & data" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .line { display: flex; align-items: center; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 108px; flex: none; }
  .spec { font-family: var(--font-mono); text-transform: uppercase; color: var(--cream); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="meta">11.5 / .08em</span><span class="spec" style="font-size:11.5px;letter-spacing:.08em;font-weight:700">Nuovo Sprint · Buttons & Tabs</span></div>
    <div class="line"><span class="meta">10.5 / .12em</span><span class="spec" style="font-size:10.5px;letter-spacing:.12em">Story Points per progetto</span></div>
    <div class="line"><span class="meta">10 / .06em</span><span class="spec" style="font-size:10px;letter-spacing:.06em;color:var(--muted)">Trascina sulle celle per assegnare</span></div>
    <div class="line"><span class="meta">9.5 / .04em</span><span class="spec" style="font-size:9.5px;letter-spacing:.04em;color:var(--muted)">09–10 · 02 Giu · Dense meta</span></div>
  </div>
</body>
</html>
