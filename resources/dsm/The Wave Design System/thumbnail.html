<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%;}
  .tile{display:flex;height:100vh;width:100vw;}
  .main{flex:1;background:var(--blue);display:flex;align-items:center;justify-content:center;padding:8%;}
  .main img{width:100%;max-width:780px;height:auto;display:block;}
  .strip{display:flex;flex-direction:column;width:19%;}
  .strip span{flex:1;display:block;}
</style>
</head>
<body>
  <div class="tile">
    <div class="main"><img src="assets/logo-thewave-cream.png" alt="The Wave"></div>
    <div class="strip">
      <span style="background:#FFD400"></span>
      <span style="background:#CDC3BA"></span>
      <span style="background:#00A98F"></span>
      <span style="background:#323232"></span>
    </div>
  </div>
</body>
</html>
